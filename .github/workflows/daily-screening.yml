name: Daily Stock Screening and Dashboard Deployment

on:
  schedule:
    # Single timezone-aware cron to avoid duplicate scheduled workflow runs.
    - cron: '30 13 * * 1-5'
      timezone: "America/Los_Angeles"
  workflow_dispatch: # Allow manual triggering (always runs)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-screening"
  cancel-in-progress: false

jobs:
  run-screening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Run daily workflow
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          uv run python run_daily_workflow.py

      - name: Export dashboard data
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONPATH: .
        run: |
          uv run python src/reporting/export_dashboard_data.py

      - name: Commit and push results
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add reports/ data/ logs/ docs/data/
          git add -f screening_output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily report $(date +'%Y-%m-%d')"

            # Rebase onto the latest remote tip in case main advanced while
            # the long-running data generation steps were in flight.
            max_attempts=3
            attempt=1
            while [ "${attempt}" -le "${max_attempts}" ]; do
              git fetch origin "${BRANCH_NAME}"

              if ! git rebase "origin/${BRANCH_NAME}"; then
                git rebase --abort || true
                echo "::error::Failed to rebase generated changes onto origin/${BRANCH_NAME}."
                exit 1
              fi

              if git push origin HEAD:${BRANCH_NAME}; then
                break
              fi

              if [ "${attempt}" -eq "${max_attempts}" ]; then
                echo "::error::Push kept racing with new remote commits after ${max_attempts} attempts."
                exit 1
              fi

              echo "Push rejected by a new upstream commit, retrying (${attempt}/${max_attempts})..."
              attempt=$((attempt + 1))
              sleep 5
            done
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload screening outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-outputs-${{ github.run_number }}
          path: screening_output/consolidated/*.txt
          retention-days: 30

      - name: Upload VARS tab JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vars-tab-json-${{ github.run_number }}
          path: artifacts/vars/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily workflow failed! Check logs for details."

  # Deploy dashboard to GitHub Pages after successful screening
  deploy-pages:
    needs: run-screening
    if: always() && needs.run-screening.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest commit (which includes the data just pushed)
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
