name: Daily Stock Screening and Dashboard Deployment

on:
  schedule:
    # Single timezone-aware cron to avoid duplicate scheduled workflow runs.
    # Backup trigger only: GitHub starts it 2.5-6 h late (measured Aug-Oct
    # 2026), so the on-time start is a workflow_dispatch from a scheduled
    # task. The guard job below skips this run when that dispatch already
    # succeeded today.
    - cron: '30 13 * * 1-5'
      timezone: "America/Los_Angeles"
  workflow_dispatch: # Allow manual triggering (always runs)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-screening"
  cancel-in-progress: false

jobs:
  # A scheduled run is the late backup for the on-time dispatch. Skip it when
  # a run of this workflow created after today's 13:00 PT close has already
  # succeeded. The concurrency group makes this run wait for an in-flight
  # dispatch, so the check sees that run's result. Any API failure runs the
  # pipeline: a duplicate run costs time, a skipped one costs a session.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip the scheduled run if today's run already succeeded
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 13:00 today in Pacific time, as UTC. zoneinfo handles PST/PDT.
          since=$(python3 -c '
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo
          pt = ZoneInfo("America/Los_Angeles")
          close = datetime.combine(datetime.now(pt).date(), time(13), pt)
          print(close.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          ')
          if ! done_ids=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-screening.yml/runs?status=success&created=>=${since}" \
              --jq '.workflow_runs[].id'); then
            echo "::warning::Run lookup failed; running the pipeline."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${done_ids}" ]; then
            echo "Run(s) created since ${since} already succeeded: ${done_ids//$'\n'/ }. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run since ${since}. Running the pipeline."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run-screening:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Run daily workflow
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          uv run python run_daily_workflow.py

      - name: Export dashboard data
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONPATH: .
        run: |
          uv run python src/reporting/export_dashboard_data.py

      - name: Commit and push results
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # screening_output/ is regenerated every run and is NOT committed
          # (parquet outputs are local scratch, pruned to the newest sessions).
          # data/ carries screened_union.json — the tag-audit routine's worklist.
          git add reports/ data/ docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily report $(date +'%Y-%m-%d')"

            # Rebase onto the latest remote tip in case main advanced while
            # the long-running data generation steps were in flight.
            max_attempts=3
            attempt=1
            while [ "${attempt}" -le "${max_attempts}" ]; do
              git fetch origin "${BRANCH_NAME}"

              if ! git rebase "origin/${BRANCH_NAME}"; then
                git rebase --abort || true
                echo "::error::Failed to rebase generated changes onto origin/${BRANCH_NAME}."
                exit 1
              fi

              if git push origin HEAD:${BRANCH_NAME}; then
                break
              fi

              if [ "${attempt}" -eq "${max_attempts}" ]; then
                echo "::error::Push kept racing with new remote commits after ${max_attempts} attempts."
                exit 1
              fi

              echo "Push rejected by a new upstream commit, retrying (${attempt}/${max_attempts})..."
              attempt=$((attempt + 1))
              sleep 5
            done
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload VARS tab JSON as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vars-tab-json-${{ github.run_number }}
          path: artifacts/vars/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily workflow failed! Check logs for details."

  # Deploy dashboard to GitHub Pages after successful screening
  deploy-pages:
    needs: run-screening
    if: always() && needs.run-screening.result == 'success'
    runs-on: ubuntu-latest

    # Least privilege for the deploy job. actions:write lets the cleanup step
    # below delete a stale Pages artifact left behind by a re-run.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest commit (which includes the data just pushed)
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Re-running the failed deploy-pages job leaves the previous attempt's
      # "github-pages" artifact attached to the run, so actions/deploy-pages
      # finds two and aborts ("Multiple artifacts named github-pages ...
      # Artifact count is 2"). Delete any leftover from an earlier attempt so
      # the re-run uploads exactly one artifact and succeeds.
      - name: Remove stale Pages artifact from earlier run attempts
        if: fromJSON(github.run_attempt) > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          for id in $ids; do
            echo "Deleting stale github-pages artifact ${id} from a prior attempt"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
