# Theme map for the Lev ETF sheet — read by the ETF Viz tab
# (export_dashboard_data.build_etf_viz_snapshot).
#
# Each sheet ticker has one entry. `side` is one of:
#   long     the ETF goes on the zone map
#   short    an inverse or volatility ETF; it stays off the map
#   exclude  the row is not a leveraged ETF; it stays off the map
#
# A long entry gets its theme in one of two ways:
#   underlying: TICKER   the underlying stock's tags in data/ticker_themes.json,
#                        read on every run, so a retag of the stock moves the ETF
#   themes: [path, ...]  explicit taxonomy paths; they win over `underlying`
# `themes: []` plots the ETF with no cluster (no taxonomy node fits it).
#
# A bare L1 is allowed here for a broad-sector fund (LABU). That is a tagging
# bug in ticker_themes.json, but no Biotech L2 describes a whole-sector basket.
#
# A sheet ticker with no entry does not plot: its side is unknown, so it could
# be inverse. The export lists it under the map. tests/test_etf_themes.py fails
# when the committed sheet copy (docs/data/etf_data.json) holds one.

# Long, single stock: the theme is the underlying's live tag.
