# Canonical Theme Taxonomy
# ─────────────────────────
# Three-level hierarchy: L1 / L2 / L3
#   - L1 is the trading narrative (e.g. "AI", "Clean Energy", "Oil & Gas").
#     Tickers sharing an L1 share an investing thesis.
#   - L2 is the application or sub-segment within that narrative.
#   - L3 is the specialty (optional, only where it adds investor-relevant detail).
#
# A ticker's theme is stored as a slash-delimited path:
#   "AI / Data Center / Memory"  (3 levels)
#   "Space / Launch"             (2 levels)
#   "Quantum Computing"          (1 level — leaf at L1)
#
# Naming rule: NO slashes inside a level name. Use " & ", "—", or single words.
# The slash " / " is reserved as the level separator in paths.
#
# Rules:
#   - L1 must come from this file's top-level keys
#   - L2 must be a key under L1's children
#   - L3 must be a key/leaf under L2's children
#   - Each L1 is one coherent narrative. Clean Energy and Oil & Gas are SIBLINGS,
#     not children of a generic "Energy" node — BE and PUMP must never share L1.
#
# Children syntax (both shapes supported by the loader):
#   children: ["A", "B"]            # flat list of leaves
#   children:                        # dict (allows nested L3)
#     A: {}
#     B:
#       children: ["x", "y"]

