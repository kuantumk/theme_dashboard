# Stock Themes Workflow Configuration

# Data fetching
price_data:
  lookback_days: 500

# Screening output retention (local scratch; regenerated each run, never committed)
screening_output:
  retention_sessions: 10   # keep only the newest N per-day parquet files per subdir

fundamental_data:
  cache_days: 7
  rate_limit_seconds: 2
  max_retries: 3
  database_path: "data/fundamentals.db"

# RS calculation
rs_score:
  lookback_days: 27
  benchmark_ticker: SPY

# Market breadth
market_breadth:
  ncfd_url: "https://www.barchart.com/stocks/quotes/$NCFD/overview"
  mmfi_url: "https://www.barchart.com/stocks/quotes/$MMFI/overview"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  aaii_url: "https://www.aaii.com/sentimentsurvey"
  # AAII sits behind a bot manager that rejects the truncated user_agent above
  # (403 with or without a full header set). Measured 2026-08-27: the complete
  # Chrome string returns 200 on its own, and no other header changes the
  # outcome. Its own key because the shared value works for barchart and there
  # is no reason to risk a working scraper.
  aaii_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  # NAAIM Exposure Index via the JSON service behind StockCharts' own charts.
  # The /sc3/ui page is an empty JS shell -- the number is not in its HTML --
  # but this endpoint serves the series anonymously, no login or cookies.
  #
  # out=csv is deliberate: out=json does NOT return JSON, it silently serves
  # the same fixed-width text table as out=text. memberrt is ignored by the
  # server and stays empty. randomNumber is the cache-buster the site's own
  # bundle sends.
  #
  # Reuses user_agent above (no Chrome/ token) -- verified working. Note the
  # gate returns 404, not 403, so a wrong agent looks like a delisted symbol.
  naaim_url: "https://stockcharts.com/quotebrain/pastdata?ticker=%21NAAIM&start={start}&barwidth=D&out=csv&memberrt=&randomNumber={cachebust}"

themes:
  metadata_file: "data/ticker_themes.json"
  company_metadata_file: "data/ticker_company_metadata.json"
  review_state_file: "data/theme_review_state.json"
  google_sheet_gid: "2036042729"
  company_metadata_cache_days: 90

  # When true, existing tickers in data/ticker_themes.json are treated as
  # ground truth: the Sheet sync never overwrites a canonical tag, and the
  # explicit `python -m src.themes.retag` CLI is the only sanctioned mutation
  # path (used by humans and by the weekday audit routine).
  git_locked_themes: true

  dashboard_theme_limit: 30
  dashboard_tickers_per_theme: 10
  min_stocks_per_theme: 3
  hot_theme_rs_threshold: 70.0
  high_momentum_threshold: 80.0
  min_scored_breadth: 2

  # Equal-weighted 4-signal composite (RS + VARS + SI + Float)
  scoring:
    max_scoring_tickers: 10
    theme_taxonomy_file: "config/theme_taxonomy.yaml"
    missing_default: 50          # neutral score for missing SI / float / VARS
    si_anchors:                  # short_interest pct -> score (linear interp, clamped 0-100)
      - [0, 0]
      - [5, 25]
      - [10, 50]
      - [20, 100]
    float_anchors:               # shares_float (millions) -> score (clamped at endpoints)
      - [100, 100]
      - [150, 75]
      - [500, 50]

# VARS screener gates (src/screening/screeners/vars.py). ADR sits at 2% —
# VARS is already ATR-normalized, and a higher floor ejects liquid large-cap
# leaders exactly when post-run tightening compresses their ADR (PANW/FTNT
# fell off the tab 2026-07-09 with VARS still rising).
vars_screener:
  min_avg_dollar_vol: 40000000  # 20-day avg dollar volume
  min_vol_sma50: 1000000        # 50-day avg share volume (knob: lower if 700k-share names wanted)
  min_close: 2.0                # last close
  min_adr_pct: 0.02             # 20-day ADR% floor (was 3.3% hardcoded)
  min_vars: 2.0                 # VARS floor

# VARS dashboard tab — leaf tables clustered under taxonomy L1 sections
vars_tab:
  min_tickers_per_l1: 3         # L1 sections with fewer members are dropped
  top_k_vars: 5                 # L1 score = mean of top-K pooled member VARS
  hot_rs_threshold: 70.0        # L1 hot flag: avg member RS >= this and n >= 3

# SI dashboard tab — heavily shorted stocks that have already sold off,
# clustered under taxonomy L1 sections. One Finviz Ownership screener call
# supplies short interest (src/data_collection/fetch_short_interest.py); the
# selloff legs come from our own price history.
si_tab:
  min_short_interest: 12.0      # percent of float; the Finviz leg gates at 10
  max_drawdown_60d: -0.25       # close vs the 60-day high
  max_drop_15d: -0.25           # worst <=15-session drop inside the last 45
  min_tickers_per_l1: 3         # L1 sections with fewer members are dropped
  top_k_si: 3                   # member SI values averaged into an L1 score
  hot_radar_rank: 10            # radar L1 rank at or better than this earns HOT

# Tightness — the coiled-range detector behind the Themes tab's coil marker.
#
# tightness = (max - min of the last `window` CLOSES) / mean close / ADR%, so
# 0.30 means the closes sat in a band under a third of one average daily range.
# A containment measure, not a per-bar one: a stock swinging a full ADR each way
# and closing flat has a narrow band and large daily moves, and the band is what
# a trader sees on the chart. Correlates +0.78 with the per-bar form it
# replaced, so this is a legibility choice, not a performance claim.
#
# ⛔ Two conditions only, and there is deliberately NO moving-average test.
# EMA distance is not tightness — it is a second location test doing a job the
# closing range already does, since a stock drifting off its averages has a wide
# band by construction. It also ejected names on rounding (PANW by $1.33 on a
# $330 stock), and swept 0.5-1.5 ATR it moved ticker excess 0.08pp and theme IC
# 0.026, both inside noise. Do not add it back.
#
# The high gate is a DISQUALIFIER, not a selector: at 0.70 it passes 82% of rows
# on its own, so it chooses nothing and only throws out wreckage. That removal
# is the value — forward 10-session excess runs 0.66pp BELOW the universe
# baseline for bare tightness and above it once the gate applies.
#
# ⛔ Know what this flag is NOT. A period-high test carrying no tightness at all
# scores a theme-level IC of +0.169 against ~+0.03 for this flag, so on pure
# ranking the location half carries the edge and tightness adds little. The flag
# IS weighted into the composite (radar.composite_weights.coil) because it marks
# the setup a breakout entry needs, which no unconditional forward-return
# measurement here models — not because it out-predicts strength. Do not quote
# the weight as evidence that it does.
#
# high_lookback must exist in min_max_lookback (create_technical_indicators);
# the code raises rather than silently substituting another window. The high is
# a rolling max of HIGHS — an earlier calibration used closes, which are
# strictly lower, and its threshold rejected every name in the motivating case.
#
# fraction 0.30 sits near the 22nd percentile of the 2026 liquid tagged
# universe and flags ~9% of it with the high gate. Not universal.
tightness:
  window: 3           # sessions in the closing range
  fraction: 0.30      # range at or below this many ADRs is "tight"
  high_lookback: 50   # period high the gate reads (needs a max50 column)
  high_frac: 0.70     # close must hold at least this share of that high

# L1 Radar — screener-independent theme-basket scoring with L1 roll-up
# and sibling-confirmation boost (see src/themes/l1_score.py docstring
# for the full R1-R6 formula). Scores ALL tagged tickers above the liquidity
# floor, not just the day's screened union.
radar:
  enabled: true
  beta: 0.3                     # sibling-confirmation boost coefficient
  top_k_leaves: 5               # leaves averaged into the L1 raw score
  top_m_members: 5              # member composites averaged into a leaf raw score
  min_breadth: 2                # min universe members for a leaf to score
  min_leaves_for_boost: 2       # L1s with fewer scored leaves get no boost
  min_avg_dollar_vol: 10000000  # universe floor: 20-day avg dollar volume
  min_close: 3.0                # universe floor: last close
  min_avg_volume: 750000        # universe floor: 50-day avg share volume (vol_sma50)
  min_avg_volume_dollar_exempt: 40000000  # share floor waived at/above this avg dollar
                                #   vol — stacked on the $10M floor a share floor only
                                #   ejects high-priced names, and STRL/CRS/ARGX-class
                                #   liquid leaders must stay (assessment 2026-07-24)
  composite_weights:            # per-ticker composite legs (each 0-100)
    rs: 0.4                     #   rs_sts_pct (27d RS-line freshness)
    vars_pct: 0.4               #   percentile of raw VARS across all tagged tickers (pre-floor pool)
    fast: 0.0                   #   rela_perf_1mo_rank — zero-weighted, backtest 2026-07: rs~fast
                                #   Spearman +0.81 and no incremental IC anywhere in the grid
                                #   (tests/RADAR_BACKTEST_FINDINGS.md §3-4)
    coil: 0.2                   #   BINARY tight_base flag (100 or 0, never graded). At 0.2 of a
                                #   normalized 1.0 a coiled stock gains exactly 20 composite
                                #   points over an identical uncoiled one -- a deliberate,
                                #   visible lever, not a tiebreak. Set to 0 to rank on strength
                                #   alone; the marker, the counts and the pinned strip all
                                #   render at any weight.
  coil_gamma: 0.5               # theme-level boost: adds gamma * the SHARE of members in a
                                #   tight base, per leaf on its own share and per L1 on its
                                #   own. SHARE, not count, or it reranks by roster size (the
                                #   lesson the tape-pressure board, the SI tab and the coil
                                #   sort each recorded). Asymmetric unlike beta -- it only
                                #   adds, because a theme with no coiled members is not worse
                                #   for it, merely not basing. Leaf z-scores are ~N(0,1), so
                                #   gamma 1.0 moves a fully-coiled theme by about one standard
                                #   deviation of leaf score.
  fast_leg_column: rela_perf_1mo_rank
  missing_default: 50           # neutral leg value when a column/value is missing
  tickers_per_leaf: 10          # chips per leaf in radar_history.json (radar.json
                                #   is uncapped — the Themes tab expands to the
                                #   full roster); also the Theme Viz member pool
  history_l1_limit: 20          # L1 entries kept per radar_history.json entry

# Dashboard data sources (Google Sheets)
dashboard:
  etf_sheet_gid: "1565194920"
  industry_etf_sheet_gid: "549753148"

# Report settings
report:
  output_dir: "reports"
  include_charts: false
  email_report: false

# Screeners to run
screeners:
  - steady_trend
  - topdog
  - gamma
  - htf
  - darvas
  - momentum_136
  - parabolic
  - vars
  - volspike
  - denvol

# Bid/Ask tape-pressure dashboard (src/bidask/) — a standalone local app, not
# part of the daily workflow. Classifies each poll as buyer- or seller-initiated
# and accumulates pressure per ticker since session start.
bidask:
  poll_seconds: 10              # cadence; ~360 requests/hour against an undocumented endpoint

  # Universe floors. traded-value and share-volume floors are pushed server-side;
  # avg dollar volume is computed client-side (the library rejects column arithmetic).
  min_today_dollar_vol: 1000000     # today's traded value
  min_avg_dollar_vol: 10000000      # avg share volume x price
  min_avg_volume: 750000            # avg share volume
  avg_window_days: 30           # one of 10/30/60/90 — the feed returns null for 20

  # The relative-volume gate: the ONLY admission path to either column.
  #
  # Relative Volume at Time (TradingView's Cumulative mode): this ticker's
  # volume since the 04:00 extended-session anchor over the mean of ITS OWN
  # 04:00-to-now volume across the last 10 sessions. 1.0 = exactly its usual
  # participation by this point of day. Computed in-app from chart bars -- see
  # src/bidask/rvol_at_time.py. The screener's raw relative_volume_10d_calc
  # divides by a full-day average instead, so flooring it directly demands 16x
  # normal participation at 09:35 and 1.8x at 15:00; it is not used here and
  # the retired keys that floored it raise.
  #
  # A price move admits nothing on its own. The retired in_play_min_change_pct
  # let a stock reach a column on a 3% move alone, however thin its tape; that
  # key raises too rather than being ignored.
  #
  # ONE SCHEDULE PER SESSION STATE, each written in minutes since ITS OWN state
  # began -- the market bands count from 09:30, not from the 04:00 anchor the
  # measure itself uses. Each floor holds until the next mark, and the first
  # also covers the minutes before it: a window with no floor would admit the
  # whole universe on the opening print. The regular session's floors tighten
  # because its denominator is small and the ratio noisy early on.
  #
  # There is no off switch. An empty schedule for any state raises, because a
  # state with no floor admits nothing for its whole window and that reads on
  # screen as a dead market rather than as a config mistake.
  in_play_rvol_schedules:
    pre_market:  [[0, 3.0]]
    market:      [[0, 0.7], [15, 1.0], [30, 1.2]]
    post_market: [[0, 1.5]]
    # Crypto has no session state and one flat floor at all times. Its day is
    # anchored at 00:00 UTC, not 04:00 ET -- MEASURED 2026-09-17, 13 of 13
    # rows: the crypto scanner's `volume` matches a 5-minute bar sum from UTC
    # midnight at a median ratio of 1.00026, where a trailing-24h sum reads
    # 1.25x it. So 1.2 here means the same thing it means on the equity tab:
    # this coin has traded 1.2x what IT usually had by this point of ITS day.
    #
    # Flat rather than stepped because a 24/7 market has no opening print to
    # tighten away from. The equity bands exist because an early denominator
    # is small and noisy; crypto's denominator at any UTC hour is a mean over
    # ten complete days cut at that same hour, and it is never freshly zero
    # except in the first minutes after midnight UTC, where the gate already
    # fails closed on a zero baseline.
    crypto:      [[0, 1.2]]
  in_play_rvol_sessions: 10     # sessions behind the historical average

  # ⛔ The trade classifier and its accumulator are gone, and so are their keys:
  # band_frac, max_spread_pct, open_auction_minutes, close_auction_minutes,
  # winsor_multiple, hit_window_minutes and min_hits_to_show. The board is
  # stateless — it recomputes each ticker's side from price and its relative
  # volume every poll — so nothing accumulates and nothing is classified.
  # Adding any of those keys back raises from `load_config`: see RETIRED_KEYS in
  # src/bidask/config.py, which names what each one did.

  # Runtime cadence bounds for the in-app control. The floor protects an
  # undocumented endpoint from being hammered under a personal account.
  min_poll_seconds: 3
  max_poll_seconds: 120

  # Crypto: symbols whose tape pressure is meaningless. Stablecoins are pegged,
  # so their "buying pressure" is micro-oscillation around the peg being read as
  # directional flow -- and because they trade constantly they float to the top
  # of the column. Gold-backed tokens (PAXG, XAUT) are deliberately NOT here:
  # they track a real moving asset.
  crypto_exclude:
    - USDC
    - USDT
    - USD1
    - USDS
    - USDD
    - USDE
    - USDF
    - USDY
    - USDP
    - FDUSD
    - PYUSD
    - RLUSD
    - TUSD
    - BUSD
    - DAI
    - FRAX
    - LUSD
    - GUSD
    - GHO
    - CRVUSD
    - SUSD
    - USTC
    - EURI
    - EURS
    - EURT
    - AEUR

  # Theme scoring. A group scores the mean of its top three members' Relative
  # Volume at Time, each capped first, plus an additive breadth term. The score
  # this replaced was the SUM of its members' margins, which made breadth swamp
  # intensity -- 0 of 67 single-name groups ever reached the screen. Splitting
  # the two halves is what bounds each one separately.
  #
  # The cap is what lets a mean survive the tail: DLXY read 2090.8 in the
  # measured session and would otherwise hand its theme a score three orders of
  # magnitude above every rival. 5.0 sits above the measured p99 of 4.329 and
  # binds 15 rows of 1,776, so ordering is preserved for better than 99% of the
  # board while the tail stops deciding it. Capped BEFORE the mean, never after.
  group_rvol_cap: 5.0

  # Breadth adds `coefficient x the share of the group's members that cleared
  # the gate`, and only ever adds. Share, not count: rosters run from 2 to 214
  # members, so a count ranks by roster size -- the same reason the coil strip
  # and the SI tab rank on share. The denominator is the group's members in the
  # poll's liquidity-filtered universe BEFORE the volume gate; after it, every
  # surviving row qualifies and the share is 1.0 for everyone.
  #
  # 0.5 is CHOSEN, not measured. Scores span the session floor (0.7) to the 5.0
  # cap, so a fully-qualifying theme gains at most +0.5 and a single member at
  # the cap still tops a broad theme running 3.5x -- the board stays
  # intensity-led with breadth as a strong tiebreak. Raise it to let breadth
  # decide; a value near the score span restores the failure above.
  group_breadth_coef: 0.5

  # Below this many qualifying members the breadth term is zero. Share alone
  # hands a one-member group the maximum, which is the opposite of what the
  # term is for. 2 mirrors the coil strip's own floor.
  group_breadth_min_members: 2

  # Display
  max_rows_per_column: 60       # per-column render cap
  max_rows_per_group: 12        # per-group cap, so one large bucket (usually an
                                #   industry fallback) cannot consume the column

# Logging
logging:
  level: INFO
  dir: "logs"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
