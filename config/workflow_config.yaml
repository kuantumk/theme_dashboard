# Stock Themes Workflow Configuration

# Data fetching
price_data:
  lookback_days: 500

# Screening output retention (local scratch; regenerated each run, never committed)
screening_output:
  retention_sessions: 10   # keep only the newest N per-day parquet files per subdir

fundamental_data:
  cache_days: 7
  rate_limit_seconds: 2
  max_retries: 3
  database_path: "data/fundamentals.db"

# RS calculation
rs_score:
  lookback_days: 27
  benchmark_ticker: SPY

# Market breadth
market_breadth:
  ncfd_url: "https://www.barchart.com/stocks/quotes/$NCFD/overview"
  mmfi_url: "https://www.barchart.com/stocks/quotes/$MMFI/overview"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

themes:
  metadata_file: "data/ticker_themes.json"
  company_metadata_file: "data/ticker_company_metadata.json"
  review_state_file: "data/theme_review_state.json"
  google_sheet_gid: "2036042729"
  company_metadata_cache_days: 90

  # When true, existing tickers in data/ticker_themes.json are treated as
  # ground truth: the Sheet sync never overwrites a canonical tag, and the
  # explicit `python -m src.themes.retag` CLI is the only sanctioned mutation
  # path (used by humans and by the weekday audit routine).
  git_locked_themes: true

  dashboard_theme_limit: 30
  dashboard_tickers_per_theme: 10
  min_stocks_per_theme: 3
  hot_theme_rs_threshold: 70.0
  high_momentum_threshold: 80.0
  min_scored_breadth: 2

  # Equal-weighted 4-signal composite (RS + VARS + SI + Float)
  scoring:
    max_scoring_tickers: 10
    theme_taxonomy_file: "config/theme_taxonomy.yaml"
    missing_default: 50          # neutral score for missing SI / float / VARS
    si_anchors:                  # short_interest pct -> score (linear interp, clamped 0-100)
      - [0, 0]
      - [5, 25]
      - [10, 50]
      - [20, 100]
    float_anchors:               # shares_float (millions) -> score (clamped at endpoints)
      - [100, 100]
      - [150, 75]
      - [500, 50]

# VARS screener gates (src/screening/screeners/vars.py). ADR sits at 2% —
# VARS is already ATR-normalized, and a higher floor ejects liquid large-cap
# leaders exactly when post-run tightening compresses their ADR (PANW/FTNT
# fell off the tab 2026-07-09 with VARS still rising).
vars_screener:
  min_avg_dollar_vol: 40000000  # 20-day avg dollar volume
  min_vol_sma50: 1000000        # 50-day avg share volume (knob: lower if 700k-share names wanted)
  min_close: 2.0                # last close
  min_adr_pct: 0.02             # 20-day ADR% floor (was 3.3% hardcoded)
  min_vars: 2.0                 # VARS floor

# VARS dashboard tab — leaf tables clustered under L1 family sections
vars_tab:
  min_tickers_per_family: 3     # families with fewer members are dropped
  top_k_vars: 5                 # family score = mean of top-K pooled member VARS
  hot_rs_threshold: 70.0        # family hot flag: avg member RS >= this and n >= 3

# Ecosystem Radar — screener-independent theme-basket scoring with L1 roll-up
# and sibling-confirmation boost (see src/themes/ecosystem_score.py docstring
# for the full R1-R6 formula). Scores ALL tagged tickers above the liquidity
# floor, not just the day's screened union.
radar:
  enabled: true
  beta: 0.3                     # sibling-confirmation boost coefficient
  top_k_leaves: 5               # leaves averaged into the ecosystem raw score
  top_m_members: 5              # member composites averaged into a leaf raw score
  min_breadth: 2                # min universe members for a leaf to score
  min_leaves_for_boost: 2       # families with fewer scored leaves get no boost
  min_avg_dollar_vol: 10000000  # universe floor: 20-day avg dollar volume
  min_close: 3.0                # universe floor: last close
  composite_weights:            # per-ticker composite legs (each 0-100)
    rs: 0.4                     #   rs_sts_pct
    vars_pct: 0.4               #   percentile of raw VARS within the radar universe
    fast: 0.2                   #   rela_perf_1mo_rank (reacts pre-breakout)
  fast_leg_column: rela_perf_1mo_rank
  missing_default: 50           # neutral leg value when a column/value is missing
  tickers_per_leaf: 10          # export cap on ticker chips per leaf
  history_ecosystem_limit: 20   # ecosystems kept per radar_history.json entry

# Dashboard data sources (Google Sheets)
dashboard:
  etf_sheet_gid: "1565194920"
  industry_etf_sheet_gid: "549753148"

# Report settings
report:
  output_dir: "reports"
  include_charts: false
  email_report: false

# Screeners to run
screeners:
  - steady_trend
  - topdog
  - gamma
  - htf
  - darvas
  - momentum_136
  - parabolic
  - vars
  - volspike
  - denvol

# Logging
logging:
  level: INFO
  dir: "logs"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
